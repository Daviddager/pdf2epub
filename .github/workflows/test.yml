name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils zip

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
